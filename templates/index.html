<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Code Explainer</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <nav>

        <div class="logo">
            🤖 AI Code Explainer
        </div>

        <div class="powered">
            Powered by Groq
        </div>

    </nav>


    <main>

        <section class="hero">

            <h1>
                Understand Code
                <span>Instantly.</span>
            </h1>

            <p>
                Paste your Python, Java, C or C++ code
                and let AI explain it in simple language.
            </p>

        </section>


        <section class="container">

            <!-- CODE SECTION -->

            <div class="card">

                <div class="toolbar">

                    <label>
                        Language:
                    </label>

                    <select id="language">

                        <option value="Auto Detect">
                            Auto Detect
                        </option>

                        <option value="Python">
                            Python
                        </option>

                        <option value="Java">
                            Java
                        </option>

                        <option value="C">
                            C
                        </option>

                        <option value="C++">
                            C++
                        </option>

                    </select>

                    <button id="clearBtn">
                        Clear
                    </button>

                </div>


                <textarea
                    id="code"
                    placeholder="Paste your code here...

Example:

def add(a, b):
    return a + b

print(add(5, 3))
"></textarea>


                <div class="bottom">

                    <span id="charCount">
                        0 characters
                    </span>

                    <button id="explainBtn">
                        🤖 Explain Code
                    </button>

                </div>

            </div>


            <!-- RESULT SECTION -->

            <div class="card">

                <div class="result-title">

                    <h2>
                        📖 AI Explanation
                    </h2>

                    <button id="copyBtn">
                        Copy
                    </button>

                </div>


                <div id="result">

                    <div class="empty">

                        <div class="brain">
                            🧠
                        </div>

                        <h3>
                            Your explanation will appear here
                        </h3>

                        <p>
                            Enter some code and click
                            "Explain Code".
                        </p>

                    </div>

                </div>

            </div>

        </section>

    </main>


    <footer>
        AI Code Explainer • Flask + Groq
    </footer>


    <script src="{{ url_for('static', filename='script.js') }}">
    </script>

</body>

</html>
